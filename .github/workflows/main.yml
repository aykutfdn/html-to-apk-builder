name: Build APK from Supabase

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: NodeJS Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Java (Android) Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Proje Klasörü ve Capacitor Kurulumu
        run: |
          mkdir my-app
          cd my-app
          npm init -y
          npm install @capacitor/cli @capacitor/core
          npm install @capacitor/android
          npx cap init MyApp com.test.myapp --web-dir www
          # Capacitor hata vermesin diye boş bir www klasörü oluşturuyoruz
          mkdir -p www
          echo "<h1>Hazirlaniyor...</h1>" > www/index.html
          npx cap add android
          
      - name: Supabase'den HTML Kodunu Çek
        run: |
          # Supabase'den bekleyen işi çekiyoruz
          RESPONSE=$(curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/build_jobs?status=eq.bekliyor&select=id,html_content&limit=1" -H "apikey: ${{ secrets.SUPABASE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")
          
          # Hata kontrolü
          if [ "$RESPONSE" == "[]" ] || [ -z "$RESPONSE" ]; then
            echo "Bekleyen iş bulunamadı!"
            exit 1
          fi
          
          # Verileri ayır
          JOB_ID=$(echo $RESPONSE | jq -r '.[0].id')
          HTML_CONTENT=$(echo $RESPONSE | jq -r '.[0].html_content')
          
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV
          
          # Kodu asıl klasörün içine yazdır
          cd my-app
          echo "$HTML_CONTENT" > www/index.html
          
      - name: Capacitor ile APK Derle
        if: env.JOB_ID != ''
        run: |
          cd my-app
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
      - name: APK'yı Supabase'e Yükle ve Durumu Güncelle
        if: env.JOB_ID != ''
        run: |
          APK_PATH="my-app/android/app/build/outputs/apk/debug/app-debug.apk"
          FILE_NAME="${{ env.JOB_ID }}.apk"
          
          # 1. APK'yı Supabase Storage'a Yükle
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/html_zips/$FILE_NAME" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH"
            
          # 2. Veritabanında durumu 'tamamlandi' yap ve APK linkini ekle
          APK_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/html_zips/$FILE_NAME"
          
          curl -s -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/build_jobs?id=eq.${{ env.JOB_ID }}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"tamamlandi\", \"apk_url\": \"$APK_URL\"}"
